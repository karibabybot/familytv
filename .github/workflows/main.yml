name: Build Family TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleDebug

      - name: Name the file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FamilyTV.apk
          cp app/build/outputs/apk/debug/app-debug.apk FamilyTV-v1.1.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Family TV (latest)
          files: |
            FamilyTV.apk
            FamilyTV-v1.1.apk
          make_latest: true
