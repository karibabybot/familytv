name: Build Asleep in my car TV app

on:
  push:
    branches: [asleep-tv]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        run: gradle assembleDebug
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk AsleepInMyCar.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asleep-latest
          name: Asleep in my car TV app (latest)
          files: AsleepInMyCar.apk
          make_latest: false
